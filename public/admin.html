<!DOCTYPE html>
<html>
<head>
  <title>Pizza Card App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Pizza Card App 🍕</h1>

  <section>
    <h2>Create Card</h2>
    <input id="customerName" placeholder="Customer name">
    <button onclick="createCard()">Create Pizza Card</button>
  </section>

  <section>
    <h2>Find Card</h2>
    <input id="cardId" placeholder="Paste card ID">
    <button onclick="findCard()">Find Card</button>
    <button onclick="startScan()">Scan QR Code</button>
    <div id="qr-reader" style="width: 300px;"></div>
  </section>

  <section id="cardDisplay"></section>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script src="admin.js"></script>
</body>
</html>
